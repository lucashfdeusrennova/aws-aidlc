[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Default select do team.md Code Style: E + F apenas (sem S/B/UP)
select = ["E", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
